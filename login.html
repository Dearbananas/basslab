<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BassLab — 登录</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f1a;--bg2:#16162a;--bg3:#1e1e38;--bg4:#252544;--fg:#e8e8f0;--fg2:#a0a0b8;--fg3:#6a6a85;--accent:#f5a623;--accent2:#e94560;--accent3:#00d4aa;--purple:#9b5de5;--blue:#3a86ff;--radius:12px;--font:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}

html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

/* === 动态背景 === */
.bg-animated{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg-animated .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:blobFloat 18s ease-in-out infinite}
.bg-animated .blob:nth-child(1){width:500px;height:500px;background:var(--accent);top:-10%;left:-10%;animation-delay:0s}
.bg-animated .blob:nth-child(2){width:400px;height:400px;background:var(--accent2);bottom:-10%;right:-5%;animation-delay:-6s}
.bg-animated .blob:nth-child(3){width:350px;height:350px;background:var(--purple);top:40%;left:50%;animation-delay:-12s}
@keyframes blobFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(60px,-40px) scale(1.15)}
  66%{transform:translate(-40px,50px) scale(.9)}
}

/* 背景星光粒子 */
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(.5)}
  50%{opacity:.8;transform:scale(1.5)}
}

/* === 登录卡片 === */
.login-wrap{position:relative;z-index:10;width:420px;max-width:90vw}
.login-card{
  background:rgba(22,22,42,.75);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(245,166,35,.25);
  border-radius:20px;
  padding:48px 40px 40px;
  box-shadow:0 25px 80px rgba(0,0,0,.5),0 0 60px rgba(245,166,35,.08);
  position:relative;
  overflow:hidden;
}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--purple),var(--accent3),var(--accent));
  background-size:200% 100%;
  animation:shimmerLine 3s linear infinite;
}
@keyframes shimmerLine{0%{background-position:0% 0}100%{background-position:200% 0}}

.logo-area{text-align:center;margin-bottom:36px}
.logo-icon{font-size:56px;display:inline-block;animation:bounce 2.5s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo-area h1{
  font-size:32px;font-weight:900;letter-spacing:1px;margin-top:8px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.logo-area .sub{font-size:13px;color:var(--fg3);margin-top:4px;letter-spacing:2px}

/* 输入框 */
.field{margin-bottom:22px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--fg2);margin-bottom:8px;letter-spacing:.5px}
.input-wrap{position:relative}
.input-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--fg3);transition:color .3s}
.input-wrap input{
  width:100%;padding:14px 14px 14px 44px;
  background:rgba(30,30,56,.6);
  border:1.5px solid var(--bg4);
  border-radius:10px;color:var(--fg);font-size:15px;font-family:var(--font);
  transition:all .3s;outline:none;
}
.input-wrap input::placeholder{color:var(--fg3)}
.input-wrap input:focus{
  border-color:var(--accent);
  background:rgba(30,30,56,.9);
  box-shadow:0 0 0 4px rgba(245,166,35,.12);
}
.input-wrap input:focus + .icon,.input-wrap:focus-within .icon{color:var(--accent)}

/* 登录按钮 */
.btn-login{
  width:100%;padding:15px;margin-top:8px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
  border:none;border-radius:10px;
  color:#fff;font-size:16px;font-weight:700;letter-spacing:1px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .15s,box-shadow .3s;
  font-family:var(--font);
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(245,166,35,.35)}
.btn-login:active{transform:translateY(0)}
.btn-login::after{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  transform:skewX(-20deg);
}
.btn-login:hover::after{animation:btnShine .8s ease}
@keyframes btnShine{0%{left:-100%}100%{left:200%}}

.hint{text-align:center;margin-top:20px;font-size:12px;color:var(--fg3)}
.hint a{color:var(--accent3);cursor:pointer}

/* === 闪亮欢迎弹层 === */
.welcome-overlay{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:rgba(15,15,26,.85);
  backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;
  transition:opacity .5s;
}
.welcome-overlay.show{opacity:1;pointer-events:auto}

.welcome-box{
  text-align:center;position:relative;
  transform:scale(.3) rotate(-10deg);opacity:0;
  transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .4s;
}
.welcome-overlay.show .welcome-box{transform:scale(1) rotate(0);opacity:1}

.welcome-emoji{font-size:80px;display:inline-block;animation:wobble .8s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

.welcome-text{
  font-size:42px;font-weight:900;line-height:1.4;
  background:linear-gradient(90deg,#f5a623,#e94560,#9b5de5,#00d4aa,#f5a623);
  background-size:300% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:rainbowSlide 2s linear infinite,textGlow 1.5s ease-in-out infinite alternate;
  text-shadow:0 0 40px rgba(245,166,35,.3);
  padding:0 20px;max-width:700px;
}
@keyframes rainbowSlide{0%{background-position:0% 0}100%{background-position:300% 0}}
@keyframes textGlow{
  from{filter:drop-shadow(0 0 10px rgba(245,166,35,.4)) drop-shadow(0 0 20px rgba(233,69,96,.3))}
  to{filter:drop-shadow(0 0 25px rgba(245,166,35,.7)) drop-shadow(0 0 50px rgba(155,93,229,.4))}
}

/* 弹层中的爆炸粒子 */
.spark{
  position:absolute;width:6px;height:6px;border-radius:50%;
  pointer-events:none;
}
@keyframes sparkFly{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}

/* 烟花环 */
.firework-ring{
  position:absolute;border:3px solid;border-radius:50%;
  pointer-events:none;opacity:0;
}
@keyframes ringExpand{
  0%{width:0;height:0;opacity:1;border-width:4px}
  100%{width:400px;height:400px;opacity:0;border-width:1px}
}

/* 登录错误提示 */
.login-error{
  text-align:center;margin-top:14px;font-size:13px;color:var(--accent2);
  opacity:0;transform:translateY(-6px);transition:all .3s;min-height:20px;
}
.login-error.show{opacity:1;transform:translateY(0)}
.login-error .shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 顶部底部装饰线 */
.deco-line{position:fixed;left:0;right:0;height:1px;z-index:5;pointer-events:none}
.deco-line.top{top:0;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent)}
.deco-line.bottom{bottom:0;background:linear-gradient(90deg,transparent,var(--purple),var(--accent3),transparent)}

/* 响应式 */
@media(max-width:480px){
  .login-card{padding:36px 24px 32px}
  .welcome-text{font-size:28px}
  .welcome-emoji{font-size:60px}
}
</style>
</head>
<body>

<!-- 动态背景 -->
<div class="bg-animated">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>
<div class="stars" id="stars"></div>
<div class="deco-line top"></div>
<div class="deco-line bottom"></div>

<!-- 登录卡片 -->
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-icon">🎸</div>
      <h1>BassLab</h1>
      <div class="sub">贝 斯 学 习 实 验 室</div>
    </div>

    <div class="field">
      <label>账号</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="输入你的账号" autocomplete="off">
        <span class="icon">👤</span>
      </div>
    </div>

    <div class="field">
      <label>密码</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="输入你的密码" autocomplete="off">
        <span class="icon">🔒</span>
      </div>
    </div>

    <button class="btn-login" id="loginBtn">登 录</button>
    <div class="login-error" id="loginError"></div>

    <div class="hint">没有账号请联系管理员 Watermelon 开通 · <a id="forgotLink">忘记密码</a></div>
  </div>
</div>

<!-- 闪亮欢迎弹层 -->
<div class="welcome-overlay" id="welcomeOverlay">
  <div class="welcome-box" id="welcomeBox">
    <div class="welcome-emoji">🎸</div>
    <div class="welcome-text" id="welcomeText"></div>
  </div>
</div>

<script>
// === 生成背景星光 ===
(function(){
  var c=document.getElementById('stars');
  for(var i=0;i<60;i++){
    var s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=Math.random()*4+'s';
    s.style.animationDuration=(2+Math.random()*4)+'s';
    c.appendChild(s);
  }
})();

// === 用户系统 ===
var DEFAULT_USERS=[
  {username:'Watermelon',password:'52zyl1314.',role:'admin'},
  {username:'SharkChili',password:'shayulajiao',role:'user'}
];

function getUsers(){
  var stored=localStorage.getItem('basslab_users');
  if(!stored){
    localStorage.setItem('basslab_users',JSON.stringify(DEFAULT_USERS));
    return DEFAULT_USERS.slice();
  }
  try{return JSON.parse(stored)}catch(e){
    localStorage.setItem('basslab_users',JSON.stringify(DEFAULT_USERS));
    return DEFAULT_USERS.slice();
  }
}

// === DOM ===
var overlay=document.getElementById('welcomeOverlay');
var welcomeText=document.getElementById('welcomeText');
var welcomeBox=document.getElementById('welcomeBox');
var errorEl=document.getElementById('loginError');
var loginCard=document.querySelector('.login-card');

function showError(msg){
  errorEl.textContent=msg;
  errorEl.classList.add('show','shake');
  loginCard.style.borderColor='rgba(233,69,96,.5)';
  setTimeout(function(){errorEl.classList.remove('shake')},400);
  setTimeout(function(){
    errorEl.classList.remove('show');
    loginCard.style.borderColor='';
  },3000);
}

function doLogin(){
  var user=document.getElementById('username').value.trim();
  var pass=document.getElementById('password').value;

  if(!user){
    showError('请输入账号');
    document.getElementById('username').focus();
    return;
  }
  if(!pass){
    showError('请输入密码');
    document.getElementById('password').focus();
    return;
  }

  var users=getUsers();
  var found=null;
  for(var i=0;i<users.length;i++){
    if(users[i].username===user && users[i].password===pass){
      found=users[i];
      break;
    }
  }

  if(!found){
    showError('账号或密码错误，请重试');
    document.getElementById('password').value='';
    document.getElementById('password').focus();
    return;
  }

  // 登录成功，存储信息
  sessionStorage.setItem('basslab_logged_in','1');
  sessionStorage.setItem('basslab_user',found.username);
  sessionStorage.setItem('basslab_role',found.role);

  // 欢迎语个性化
  var welcomeMsg='欢迎未来的bass新星鲨老师登录本网站~！！！';
  showWelcome(welcomeMsg);
}

function showWelcome(fullText){
  welcomeText.textContent='';
  overlay.classList.add('show');
  spawnFireworkRing();

  var i=0;
  var typing=setInterval(function(){
    if(i<fullText.length){
      welcomeText.textContent+=fullText[i];
      i++;
      spawnSparks(welcomeBox);
    }else{
      clearInterval(typing);
      burstFireworks();
      setTimeout(function(){
        window.location.href='index.html';
      },3000);
    }
  },120);
}

function spawnSparks(target){
  var rect=target.getBoundingClientRect();
  var cx=rect.left+rect.width/2;
  var cy=rect.top+rect.height/2;
  var colors=['#f5a623','#e94560','#9b5de5','#00d4aa','#3a86ff','#fff'];
  for(var i=0;i<8;i++){
    var s=document.createElement('div');
    s.className='spark';
    s.style.background=colors[Math.floor(Math.random()*colors.length)];
    s.style.left=cx+'px';
    s.style.top=cy+'px';
    var angle=Math.random()*Math.PI*2;
    var dist=60+Math.random()*120;
    s.style.setProperty('--tx',Math.cos(angle)*dist+'px');
    s.style.setProperty('--ty',Math.sin(angle)*dist+'px');
    s.style.animation='sparkFly '+(0.6+Math.random()*0.4)+'s ease-out forwards';
    document.body.appendChild(s);
    (function(el){setTimeout(function(){el.remove();},1200)})(s);
  }
}

function spawnFireworkRing(){
  var rect=welcomeBox.getBoundingClientRect();
  var cx=rect.left+rect.width/2;
  var cy=rect.top+rect.height/2;
  var colors=['#f5a623','#e94560','#9b5de5','#00d4aa'];
  for(var i=0;i<3;i++){
    (function(idx){
      setTimeout(function(){
        var ring=document.createElement('div');
        ring.className='firework-ring';
        ring.style.left=cx+'px';
        ring.style.top=cy+'px';
        ring.style.transform='translate(-50%,-50%)';
        ring.style.borderColor=colors[idx%colors.length];
        ring.style.animation='ringExpand 1s ease-out forwards';
        document.body.appendChild(ring);
        setTimeout(function(){ring.remove();},1200);
      },idx*200);
    })(i);
  }
}

function burstFireworks(){
  var colors=['#f5a623','#e94560','#9b5de5','#00d4aa','#3a86ff','#fff'];
  for(var b=0;b<6;b++){
    (function(idx){
      setTimeout(function(){
        var bx=window.innerWidth*(0.15+Math.random()*0.7);
        var by=window.innerHeight*(0.15+Math.random()*0.5);
        for(var i=0;i<20;i++){
          var s=document.createElement('div');
          s.className='spark';
          s.style.width='5px';s.style.height='5px';
          s.style.background=colors[Math.floor(Math.random()*colors.length)];
          s.style.left=bx+'px';
          s.style.top=by+'px';
          s.style.boxShadow='0 0 8px currentColor';
          var angle=(Math.PI*2*i)/20;
          var dist=80+Math.random()*100;
          s.style.setProperty('--tx',Math.cos(angle)*dist+'px');
          s.style.setProperty('--ty',Math.sin(angle)*dist+'px');
          s.style.animation='sparkFly '+(0.8+Math.random()*0.6)+'s ease-out forwards';
          document.body.appendChild(s);
          (function(el){setTimeout(function(){el.remove();},1600)})(s);
        }
      },idx*300);
    })(b);
  }
}

// === 事件绑定 ===
document.getElementById('loginBtn').addEventListener('click',doLogin);

document.getElementById('password').addEventListener('keydown',function(e){
  if(e.key==='Enter')doLogin();
});
document.getElementById('username').addEventListener('keydown',function(e){
  if(e.key==='Enter')document.getElementById('password').focus();
});

// 忘记密码提示
document.getElementById('forgotLink').addEventListener('click',function(){
  showError('请联系管理员 Watermelon 重置密码');
});
</script>

</body>
</html>
